# 参照 /Volumes/juanshen/docker/new-api/docker-compose.yml
# 加入外部 Traefik 网络 (apps)，由 Traefik 反代 + 自动证书。
# 本地仍保留 7860 直连端口，方便直连调试。
#
# 部署：
#   mkdir -p data
#   docker network create apps   # 一次性，若已存在会报错可忽略
#   docker compose up -d --build
#   docker compose logs -f
#
# 配合 Traefik 时：本机 952712.xyz 域名的 DNS 需指向 Traefik 所在主机。
# ⚠️ 上游请求需走风控代理，按仓库 CLAUDE.md 在 .env 里设
#    HTTP_PROXY / HTTPS_PROXY / NO_PROXY（reqwest 自动读）。

networks:
  apps:
    external: true

services:
  qwen2api-rs:
    build: .
    image: qwen2api-rs:latest
    container_name: qwen2api-rs
    ports:
      - "7860:7860"          # 保留直连；Traefik 反代为主，对外不依赖该端口
    volumes:
      # 账号/金钥/上传文件等持久化数据；可直接沿用原 Python 版的 data/ 内容
      - ./data:/app/data
    # 密钥类配置（ADMIN_KEY 等）请放到同目录的 .env 文件里（已在 .gitignore）。
    # 复制仓库根目录的 .env.example 起步：  cp ../.env.example .env
    env_file:
      - .env
    environment:
      PORT: "7860"
      LOG_LEVEL: "info"
      MAX_INFLIGHT_PER_ACCOUNT: "2"
      MAX_RETRIES: "3"
      ACCOUNT_MIN_INTERVAL_MS: "3000"     # 风控：同账号最小间隔(毫秒)，0=不限
      CHAT_ID_PREWARM_TARGET_PER_ACCOUNT: "5"
      CHAT_ID_PREWARM_MAX_ACCOUNTS: "8"
      DEFAULT_MODEL: "qwen3.7-plus"
      DATA_DIR: "./data"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qwen2api-rs.rule=Host(`qwen2api-rs.952712.xyz`)"
      - "traefik.http.routers.qwen2api-rs.entrypoints=websecure"
      - "traefik.http.routers.qwen2api-rs.tls.certresolver=myresolver"
      - "traefik.http.routers.qwen2api-rs.tls.domains[0].main=qwen2api-rs.952712.xyz"
      - "traefik.http.services.qwen2api-rs.loadbalancer.server.port=7860"
      - "traefik.http.routers.qwen2api-rs.middlewares=secure-headers@file"
    networks:
      - apps
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:7860/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
